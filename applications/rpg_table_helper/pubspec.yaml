name: quest_keeper
description: "A tablet app helping with your favorite RPG table top games!"
publish_to: 'none'

version: 0.9.3+264

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  image_picker: ^1.1.2
  mime: ^2.0.0
  uuid: ^4.4.0
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.5
  timeago: ^3.7.0
  flutter_localizations:
    sdk: flutter
  intl: any
  shadow_widget: ^0.1.1
  get_it: ^9.3.0
  modal_bottom_sheet: ^3.0.0-pre
  chopper: ^8.0.1+1
  json_annotation: ^4.9.0
  flutter_riverpod: ^3.4.3
  copy_with_extension: ^6.0.0
  flutter_markdown: ^0.7.3+1
  http: ^1.2.2
  collection: ^1.18.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.5
  pointycastle: ^3.9.1
  asn1lib: ^1.5.5
  encrypt: ^5.0.3
  google_sign_in: ^7.2.0
  loading_indicator: ^4.0.2
  flutter_svg: ^2.0.11
  transparent_image: ^2.0.1
  cached_network_image: ^4.0.5
  auto_size_text: ^3.0.0
  animated_text_kit: ^4.2.2
  google_fonts: ^9.0.0
  themed: ^8.3.1
  page_view_dot_indicator: ^2.3.0
  flutter_cache_manager: ^3.4.1
  pull_to_refresh: ^2.0.0
  easy_image_viewer: ^1.5.1
  http_parser: ^4.0.2
  url_launcher: ^6.3.1
  connectivity_plus: ^7.1.0
  json_patch: ^3.0.0
  flutter_secure_storage: ^11.2.0

# Flutter 3.41 + path_provider_foundation 2.6 FFI embeds the wrong
# objective_c.framework arch when alternating device/simulator builds
# (have iOS / need iOS-simulator). Stay on the method-channel release.
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  golden_toolkit: ^0.15.0
  custom_lint: ^0.8.0
  json_serializable: ^6.8.0
  build_runner: ^2.3.3
  copy_with_extension_gen: ^6.0.0
  flutter_launcher_icons: "^0.14.1"
  chopper_generator: ^8.0.3
  swagger_dart_code_generator: ^3.0.1
  fake_async: ^1.3.3

flutter:
  # Flutter 3.47 moves iOS plugins to Swift Package Manager by default. Stay on
  # CocoaPods until a release archive has been tested with SPM: the Podfile's
  # post_install (deployment target 15.0, dSYMs) would not apply to SPM plugins.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/fortests/
    - assets/images/character_sheet_skins/
    - assets/extern/
    - assets/extern/logos/
    - assets/
    - assets/fonts/
    - assets/fonts/Merriweather/
    - assets/icons/
    - assets/icons/inappcategoryicons/

  fonts:
    - family: Ruwudu
      fonts:
       - asset: assets/fonts/Merriweather/Merriweather-Regular.ttf
       - asset: assets/fonts/Merriweather/Merriweather-Bold.ttf
         weight: 700

flutter_intl:
  enabled: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
